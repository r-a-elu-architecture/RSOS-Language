[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsoslang"
version = "0.2.1"
description = "RSOS Language: a spatial-symbolic programming language for humans and AI"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rsoslang = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
